name: Build gdbserver

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  GDB_VERSION: "17.1"
  GMP_VERSION: "6.3.0"
  MPFR_VERSION: "4.2.2"

jobs:
  build:
    name: gdbserver (${{ matrix.architecture }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            gdbserver_host: "x86_64-linux-musl"
            cc: x86_64-linux-musl-gcc
            cxx: x86_64-linux-musl-g++
          - architecture: armv7l
            gdbserver_host: "arm-linux-musleabihf"
            cc: arm-linux-musleabihf-gcc
            cxx: arm-linux-musleabihf-g++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install musl toolchains and build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            musl-tools \
            wget \
            xz-utils

          # Install musl.cc prebuilt cross toolchains (includes gcc/g++)
          wget -q https://musl.cc/x86_64-linux-musl-cross.tgz
          tar -xzf x86_64-linux-musl-cross.tgz
          wget -q https://musl.cc/arm-linux-musleabihf-cross.tgz
          tar -xzf arm-linux-musleabihf-cross.tgz

          echo "$GITHUB_WORKSPACE/x86_64-linux-musl-cross/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/arm-linux-musleabihf-cross/bin" >> $GITHUB_PATH

      - name: Build gdbserver and its dependencies from source
        run: |
          export CC=${{ matrix.cc }}
          export CXX=${{ matrix.cxx }}

          wget https://ftp.gnu.org/gnu/gmp/gmp-${{ env.GMP_VERSION }}.tar.gz
          tar -xf gmp-${{ env.GMP_VERSION }}.tar.gz
          cd gmp-${{ env.GMP_VERSION }}
          ./configure \
              --host=${{ matrix.gdbserver_host }} \
              --enable-static --disable-shared \
              --prefix=$GITHUB_WORKSPACE/gmp-${{ env.GMP_VERSION }}/build
          make -j"$(nproc)"
          make install
          cd ..

          wget https://ftp.gnu.org/gnu/mpfr/mpfr-${{ env.MPFR_VERSION }}.tar.gz
          tar -xf mpfr-${{ env.MPFR_VERSION }}.tar.gz
          cd mpfr-${{ env.MPFR_VERSION }}
          ./configure \
              --host=${{ matrix.gdbserver_host }} \
              --enable-static --disable-shared \
              --with-gmp=$GITHUB_WORKSPACE/gmp-${{ env.GMP_VERSION }}/build \
              --prefix=$GITHUB_WORKSPACE/mpfr-${{ env.MPFR_VERSION }}/build
          make -j"$(nproc)"
          make install
          cd ..

          wget https://ftp.gnu.org/gnu/gdb/gdb-${{ env.GDB_VERSION }}.tar.gz
          tar -xf gdb-${{ env.GDB_VERSION }}.tar.gz
          cd gdb-${{ env.GDB_VERSION }}

          ./configure \
            --host=${{ matrix.gdbserver_host }} \
            --enable-static --disable-tui --disable-inprocess-agent \
            --with-gmp=$GITHUB_WORKSPACE/gmp-${{ env.GMP_VERSION }}/build \
            --with-mpfr=$GITHUB_WORKSPACE/mpfr-${{ env.MPFR_VERSION }}/build \
            --prefix=$GITHUB_WORKSPACE/gdb-${{ env.GDB_VERSION }}/build

          make -j"$(nproc)"
          make install-strip
          cd ..
          
          patchelf --set-interpreter /usr/lib/ld-linux-x86-64.so.2 $GITHUB_WORKSPACE/gdb-${{ env.GDB_VERSION }}/build/bin/gdb
          patchelf --set-interpreter /usr/lib/ld-linux-x86-64.so.2 $GITHUB_WORKSPACE/gdb-${{ env.GDB_VERSION }}/build/bin/gdbserver

      - name: Verify binary
        run: |
          echo "Checking built artifacts:"
          ls -la $GITHUB_WORKSPACE/gdb-${{ env.GDB_VERSION }}/build/bin
          file $GITHUB_WORKSPACE/gdb-${{ env.GDB_VERSION }}/build/bin/gdbserver

      - name: Upload gdbserver artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdbserver-${{ env.GDB_VERSION }}-linux-musl-${{ matrix.architecture }}
          path: ${{ github.workspace }}/gdb-${{ env.GDB_VERSION }}/build/bin